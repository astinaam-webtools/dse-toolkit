<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stock Details - DSE Toolkit</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <nav class="topbar" aria-label="Page">
    <a href="./market.html" class="topbar__back">← Back to Market Lens</a>
  </nav>

  <div id="app">
    <div id="loading" style="padding: 2rem; text-align: center;">Loading stock details...</div>
    
    <div id="content" style="display: none;">
      <header class="detail-header">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <h1 id="stock-symbol" style="margin: 0; font-size: 2rem;"></h1>
            <p id="stock-name" style="margin: 0.5rem 0 0; color: var(--muted);"></p>
            <span id="stock-sector"></span>
          </div>
          <div style="text-align: right;">
            <div id="stock-price" style="font-size: 2rem; font-weight: 700;"></div>
            <div id="stock-change" style="font-size: 1.1rem; font-weight: 500;"></div>
          </div>
        </div>
      </header>

      <main>
        <div style="padding: 1.5rem 1.5rem 0;">
          <div id="chart-container">
            <!-- Chart will be injected here -->
          </div>
        </div>

        <div class="detail-grid" id="metrics-grid">
          <!-- Metrics will be populated here -->
        </div>
        
        <div style="padding: 1.5rem;">
           <h3>AI Analysis</h3>
           <button class="btn-ai" id="btn-analyze-page">
            ✨ Start AI Chat Analysis
          </button>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="./src/stockDetailApp.js"></script>
  <script type="module" src="./src/mobile-nav.js"></script>

  <div id="more-mount"></div>
  <div id="tabbar-mount"></div>
  <div id="footer-mount"></div>
  <script type="module" src="./src/swRegister.js"></script>
  <script type="module" src="./src/shell.js"></script>
</body>
</html>
