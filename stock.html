<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stock Details - DSE Toolkit</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body data-page="stock">
  <nav class="topbar" aria-label="Page">
    <a href="./market.html" class="topbar__back">← Back to Market Lens</a>
  </nav>

  <div id="app">
    <div id="loading" class="empty-state">
      <div class="skeleton" style="height: 120px; max-width: 400px; margin-bottom: 1rem;"></div>
      <p>Loading stock details...</p>
    </div>
    
    <div id="content" hidden>
      <header class="detail-header">
        <div class="detail-header__inner">
          <div>
            <h1 id="stock-symbol" class="stock-title"></h1>
            <p id="stock-name" class="stock-sub"></p>
            <span id="stock-sector" class="status-pill"></span>
          </div>
          <div class="stock-price-block">
            <div id="stock-price" class="stock-price-val"></div>
            <div id="stock-change" class="stock-price-change"></div>
          </div>
        </div>
      </header>

      <main>
        <div class="stock-chart" id="chart-wrap">
          <div id="chart-container" class="stock-chart__canvas"></div>
          <div id="chart-range" class="stock-range" hidden>
            <div class="stock-range__end">
              <span class="stock-range__label">Low</span>
              <span id="chart-low" class="stock-range__value"></span>
            </div>
            <div class="stock-range__mid">
              <span id="chart-sessions"></span>
              <span id="chart-span" class="stock-range__span"></span>
            </div>
            <div class="stock-range__end stock-range__end--right">
              <span class="stock-range__label">High</span>
              <span id="chart-high" class="stock-range__value"></span>
            </div>
          </div>
          <div class="stock-chart__controls" aria-label="Chart range">
            <div class="chip-row stock-chart__presets" role="group" aria-label="Range presets" id="chart-presets">
              <button type="button" class="chip chip--accent stock-chart__chip" data-range="default" aria-pressed="true">Default</button>
              <button type="button" class="chip stock-chart__chip" data-range="1m" aria-pressed="false">1M</button>
              <button type="button" class="chip stock-chart__chip" data-range="3m" aria-pressed="false">3M</button>
              <button type="button" class="chip stock-chart__chip" data-range="6m" aria-pressed="false">6M</button>
              <button type="button" class="chip stock-chart__chip" data-range="ytd" aria-pressed="false">YTD</button>
              <button type="button" class="chip stock-chart__chip" data-range="all" aria-pressed="false">All</button>
              <button type="button" class="chip stock-chart__chip" data-range="custom" aria-pressed="false">Custom</button>
            </div>
            <div id="chart-custom" class="stock-chart__custom" hidden>
              <div class="stock-chart__custom-fields">
                <div class="field">
                  <label for="chart-from">From</label>
                  <input type="date" id="chart-from" class="input" autocomplete="off">
                </div>
                <div class="field">
                  <label for="chart-to">To</label>
                  <input type="date" id="chart-to" class="input" autocomplete="off">
                </div>
              </div>
              <button type="button" class="btn btn--solid btn--sm" id="chart-custom-apply">Apply</button>
            </div>
            <p id="chart-range-status" class="stock-chart__status" role="status" aria-live="polite" hidden></p>
          </div>
        </div>

        <div id="trading-strip" class="stock-strip" hidden></div>
        <div id="metrics-groups" class="stock-groups"></div>

        <div class="detail-section" id="behavior-profile" hidden>
          <h3>Behaviour Profile</h3>
          <div id="behavior-output"></div>
        </div>

        <div class="detail-section">
          <h3>AI Analysis</h3>
          <button class="btn btn--ai" id="btn-analyze-page">
            ✨ Start AI Chat Analysis
          </button>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="./src/stockDetailApp.js"></script>
  <script type="module" src="./src/mobile-nav.js"></script>

  <div id="siderail-mount"></div>
  <div id="more-mount"></div>
  <div id="tabbar-mount"></div>
  <div id="footer-mount"></div>
  <script type="module" src="./src/swRegister.js"></script>
  <script type="module" src="./src/shell.js"></script>
</body>
</html>
