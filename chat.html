<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSE Toolkit - AI Chat</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .chat-shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 1rem;
      min-height: calc(100vh - 6rem);
    }

    .chat-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.92));
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(2, 6, 23, 0.26);
    }

    .thread-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .thread-pane__header {
      padding: 1rem;
      display: grid;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }

    .btn-new-thread {
      border: 1px solid rgba(16, 185, 129, 0.5);
      background: linear-gradient(120deg, rgba(16, 185, 129, 0.25), rgba(16, 185, 129, 0.12));
      color: #d1fae5;
      border-radius: 12px;
      padding: 0.6rem 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .thread-list {
      overflow-y: auto;
      padding: 0.6rem;
      display: grid;
      gap: 0.5rem;
    }

    .thread-item {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.5);
      color: var(--text);
      border-radius: 12px;
      padding: 0.65rem;
      cursor: pointer;
      text-align: left;
    }

    .thread-item.active {
      border-color: rgba(16, 185, 129, 0.7);
      background: rgba(16, 185, 129, 0.16);
    }

    .thread-item__title {
      font-size: 0.9rem;
      font-weight: 600;
      display: block;
      margin-bottom: 0.2rem;
    }

    .thread-item__meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .chat-main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .chat-topbar {
      padding: 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      display: grid;
      gap: 0.8rem;
    }

    .chat-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .chat-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .chat-controls select,
    .chat-input {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
    }

    .btn-mini {
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
      border-radius: 10px;
      padding: 0.52rem 0.7rem;
      cursor: pointer;
    }

    .btn-danger {
      border-color: rgba(248, 113, 113, 0.5);
      color: #fecaca;
      background: rgba(127, 29, 29, 0.28);
    }

    .chat-meta-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      font-size: 0.78rem;
    }

    .meta-chip {
      padding: 0.36rem 0.55rem;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 999px;
      color: #bfdbfe;
      background: rgba(30, 41, 59, 0.75);
    }

    .chat-feed {
      overflow-y: auto;
      padding: 1rem;
      display: grid;
      align-content: start;
      gap: 0.8rem;
      background:
        radial-gradient(circle at 20% 0%, rgba(16, 185, 129, 0.08), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.07), transparent 36%),
        #0b1220;
    }

    .bubble {
      max-width: 86%;
      padding: 0.82rem;
      border-radius: 12px;
      line-height: 1.5;
      border: 1px solid rgba(148, 163, 184, 0.2);
      word-wrap: break-word;
    }

    .bubble-user {
      justify-self: end;
      background: rgba(16, 185, 129, 0.22);
      border-color: rgba(16, 185, 129, 0.48);
      color: #d1fae5;
    }

    .bubble-assistant {
      justify-self: start;
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
    }

    .bubble-system {
      justify-self: center;
      background: rgba(59, 130, 246, 0.2);
      color: #dbeafe;
      text-align: center;
      font-size: 0.85rem;
    }

    .bubble-meta {
      margin-top: 0.45rem;
      font-size: 0.72rem;
      color: #94a3b8;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .composer {
      padding: 0.8rem 1rem 1rem;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.6rem;
      align-items: center;
    }

    .chat-input {
      width: 100%;
      min-height: 46px;
    }

    .btn-send {
      border: 1px solid rgba(16, 185, 129, 0.58);
      background: linear-gradient(120deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.25));
      color: #d1fae5;
      border-radius: 10px;
      padding: 0.62rem 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .status-note {
      font-size: 0.78rem;
      color: #93c5fd;
    }

    @media (max-width: 980px) {
      .chat-shell {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .thread-pane {
        max-height: 220px;
      }

      .bubble {
        max-width: 96%;
      }

      .composer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="nav-container">
      <a href="./index.html" class="nav-logo">DSE Toolkit</a>
      <div class="nav-links">
        <a href="./market.html">Market</a>
        <a href="./portfolio.html">Stocks</a>
        <a href="./funds.html">Funds</a>
      </div>
    </div>
  </nav>
  <div class="safe-top-spacer"></div>

  <main class="chat-shell">
    <aside class="chat-card thread-pane">
      <div class="thread-pane__header">
        <button id="chat-back" class="btn-mini" type="button">← Back</button>
        <button id="chat-new-thread" class="btn-new-thread" type="button">+ New Thread</button>
        <div class="status-note" id="chat-sync-state">Sync state unknown.</div>
      </div>
      <div id="chat-thread-list" class="thread-list"></div>
    </aside>

    <section class="chat-card chat-main">
      <div class="chat-topbar">
        <div class="chat-top-row">
          <h2 style="margin: 0;">AI Analyst Chat</h2>
          <div class="chat-controls">
            <label for="chat-model-select" class="status-note">Model</label>
            <select id="chat-model-select"></select>
            <button id="chat-clear-thread" class="btn-mini" type="button">Clear Thread</button>
            <button id="chat-delete-thread" class="btn-mini btn-danger" type="button">Delete Thread</button>
          </div>
        </div>
        <div class="chat-meta-panel" id="chat-meta-panel"></div>
      </div>

      <div id="chat-feed" class="chat-feed"></div>

      <form id="chat-composer" class="composer">
        <input id="chat-input" class="chat-input" type="text" placeholder="Ask anything about the selected stock or market context..." autocomplete="off" />
        <button id="chat-send" class="btn-send" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script type="module" src="./src/chatApp.js"></script>
  <script type="module" src="./src/navStatus.js"></script>
  <script type="module" src="./src/swRegister.js"></script>
  <script type="module" src="./src/mobile-nav.js"></script>
</body>
</html>
