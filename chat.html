<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DSE Toolkit - AI Chat</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* ── Full-height flex layout ── */
    html { height: 100%; }
    body  { height: 100%; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
    .nav-bar { flex-shrink: 0; position: relative; }  /* override sticky from styles.css */

    /* ── Page wrapper fills remaining height ── */
    .chat-page {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      overflow: hidden;
      background: var(--bg);
    }
    .chat-page > * { min-width: 0; min-height: 0; overflow: hidden; }

    /* ── Drawer checkbox (hidden) ── */
    #drawer-toggle { display: none; }

    /* ── Backdrop overlay ── */
    .drawer-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    #drawer-toggle:checked ~ .drawer-backdrop {
      opacity: 1; pointer-events: auto;
    }

    /* ── Thread drawer (mobile = off-screen, desktop = inline) ── */
    .thread-drawer {
      position: fixed;
      inset-block: 0; left: 0;
      width: min(280px, calc(100vw - 42px));
      z-index: 100;
      background: var(--card);
      border-right: 1px solid var(--border);
      border-radius: 0 12px 12px 0;
      box-shadow: 0 10px 28px rgba(2, 6, 23, 0.28);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform .22s ease;
    }
    #drawer-toggle:checked ~ .chat-page .thread-drawer {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex; align-items: center;
      gap: .5rem;
      padding: .55rem .65rem;
      border-bottom: 1px solid var(--border);
    }
    .drawer-head .drawer-title {
      flex: 1; font-weight: 700; font-size: .9rem; color: var(--text);
    }
    .drawer-close {
      background: none; border: none;
      font-size: 1.3rem; line-height: 1;
      color: var(--muted); cursor: pointer;
      padding: .15rem .35rem;
    }

    .drawer-actions {
      display: flex; gap: .35rem;
      padding: .45rem .65rem;
      border-bottom: 1px solid var(--border);
    }
    .btn-new-thread {
      flex: 1;
      border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      border-radius: 8px;
      padding: .38rem .55rem;
      font-weight: 600; font-size: .8rem;
      cursor: pointer; font-family: inherit;
    }

    .btn-new-thread--main {
      width: 100%;
      margin-top: .35rem;
      padding: .44rem .6rem;
      font-size: .82rem;
      border-radius: 10px;
    }

    .thread-list {
      flex: 1; overflow-y: auto;
      padding: .35rem;
      margin-top: 1rem;
      display: grid; gap: .25rem; align-content: start;
      -webkit-overflow-scrolling: touch;
    }
    .thread-item {
      width: 97%;
      border: 1px solid var(--border);
      background: var(--card); color: var(--text);
      border-radius: 8px;
      padding: .45rem .55rem;
      cursor: pointer; text-align: left;
      font-family: inherit; font-size: .82rem;
    }
    .thread-item:active { opacity: .7; }
    .thread-item.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--card));
    }
    .thread-item__title {
      font-weight: 600; display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thread-item__meta {
      font-size: .68rem; color: var(--muted); margin-top: .05rem;
    }

    .drawer-footer {
      padding: .4rem .65rem;
      border-top: 1px solid var(--border);
    }

    /* ── Chat main area ── */
    .chat-main {
      display: flex; flex-direction: column;
      overflow: hidden; min-height: 0; min-width: 0;
    }

    /* ── Top bar ── */
    .chat-topbar {
      display: flex; align-items: center;
      gap: .35rem;
      padding: .4rem .55rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-menu {
      background: none; border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer;
      padding: .25rem .4rem;
      font-size: 1.05rem; line-height: 1;
      color: var(--text); flex-shrink: 0;
    }
    .topbar-title {
      font-weight: 700; font-size: .85rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .chat-controls {
      display: flex; align-items: center; gap: .25rem;
      flex: 1; min-width: 0;
      justify-content: flex-end;
    }
    .chat-controls select {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .25rem .35rem;
      font-size: .75rem; font-family: inherit;
      flex: 1;
      min-width: 0;
      width: clamp(128px, 42vw, 280px);
      max-width: 280px;
    }
    .btn-mini {
      border: 1px solid var(--border);
      background: var(--card); color: var(--muted);
      border-radius: 6px;
      padding: .25rem .45rem;
      font-size: .72rem; font-family: inherit;
      cursor: pointer; white-space: nowrap;
    }
    .btn-danger {
      border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      color: var(--danger);
    }

    /* ── Feed ── */
    /* ── Feed ── */
    .chat-feed {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: .75rem 1rem;
      display: flex; flex-direction: column;
      gap: .75rem;
      -webkit-overflow-scrolling: touch;
    }
    .bubble {
      max-width: 85%;
      padding: .75rem 1rem;
      border-radius: var(--r-md);
      line-height: 1.55;
      font-size: var(--fs-sm);
      word-wrap: break-word; overflow-wrap: break-word;
      box-shadow: var(--shadow-1);
    }
    .bubble-user {
      align-self: flex-end;
      background: var(--accent); color: var(--accent-contrast);
      border-radius: 18px 18px 4px 18px;
    }
    .bubble-assistant {
      align-self: flex-start;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
    }
    .bubble-system {
      align-self: center;
      background: transparent; color: var(--text-muted);
      text-align: center; font-size: var(--fs-xs);
      padding: .35rem .75rem;
      box-shadow: none;
    }
    .bubble-meta {
      margin-top: .35rem; font-size: var(--fs-xs); color: var(--text-muted);
      display: flex; gap: .35rem; flex-wrap: wrap; align-items: center;
    }

    .bubble-meta-toggle,
    .bubble-retry {
      margin-top: .3rem;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      border-radius: var(--r-pill);
      padding: .2rem .6rem;
      font-size: var(--fs-xs);
      cursor: pointer;
      font-family: inherit;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .bubble-meta-toggle:hover,
    .bubble-retry:hover {
      background: var(--surface-sunk);
      color: var(--text);
    }

    .bubble-retry {
      color: var(--down);
      border-color: var(--down-soft);
    }

    .bubble-thinking {
      background: var(--surface-sunk);
      border: 1px dashed var(--border-strong);
    }

    .thinking-dots {
      display: inline-flex;
      gap: .3rem;
      margin-right: .5rem;
      vertical-align: middle;
    }

    .thinking-dots span {
      width: .4rem;
      height: .4rem;
      border-radius: var(--r-pill);
      background: var(--accent);
      opacity: .35;
      animation: thinking-pulse 1s ease-in-out infinite;
    }

    .thinking-dots span:nth-child(2) { animation-delay: .16s; }
    .thinking-dots span:nth-child(3) { animation-delay: .32s; }

    @keyframes thinking-pulse {
      0%, 100% { opacity: .25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
    }

    /* ── Modern Chat Welcome & Quick Prompts ── */
    .chat-welcome {
      max-width: 560px;
      margin: auto auto;
      text-align: center;
      padding: var(--s-6) var(--s-4);
    }
    .chat-welcome__icon {
      font-size: 2.2rem;
      margin-bottom: var(--s-2);
    }
    .chat-welcome h3 {
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      margin: 0 0 var(--s-2);
      color: var(--text);
    }
    .chat-welcome p {
      font-size: var(--fs-sm);
      color: var(--text-muted);
      margin: 0 0 var(--s-5);
      line-height: var(--lh-base);
    }
    .quick-prompts {
      display: flex;
      flex-direction: column;
      gap: var(--s-2);
      text-align: left;
    }
    .quick-prompt-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: var(--s-3) var(--s-4);
      font-size: var(--fs-sm);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out), background var(--dur-1);
    }
    .quick-prompt-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }
    .quick-prompt-btn:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 1px;
    }

    /* ── Modern Unified Composer ── */
    .composer {
      padding: var(--s-3) var(--s-4);
      padding-bottom: calc(var(--s-3) + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .composer-box {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-lg);
      padding: var(--s-3);
      box-shadow: var(--shadow-2);
      transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
      display: flex;
      flex-direction: column;
      gap: var(--s-2);
    }

    .composer-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .chat-input,
    textarea.chat-input,
    textarea.chat-input:hover,
    textarea.chat-input:focus,
    textarea.chat-input:focus-visible {
      width: 100%;
      background: transparent !important;
      color: var(--text);
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      padding: 0 var(--s-1);
      font-size: var(--fs-sm);
      font-family: inherit;
      resize: none;
      min-height: 40px;
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s-2);
      padding-top: var(--s-1);
      border-top: 1px solid var(--border);
    }

    .composer-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--s-2);
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 4px 10px;
      cursor: pointer;
      user-select: none;
      transition: background var(--dur-1), border-color var(--dur-1), color var(--dur-1);
    }

    .composer-chip input[type="checkbox"] {
      appearance: none;
      width: 0;
      height: 0;
      position: absolute;
      opacity: 0;
    }

    .composer-chip:has(input:checked) {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .composer-chip:has(input:disabled) {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .composer-chip__icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .btn-send {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: var(--r-pill);
      border: none;
      background: var(--accent);
      color: var(--accent-contrast);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background var(--dur-1), transform var(--dur-1) var(--ease-spring);
    }

    .btn-send svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .btn-send:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .btn-send:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--surface-sunk);
      color: var(--text-faint);
    }

    .status-note { font-size: var(--fs-xs); color: var(--text-muted); }

    /* ── Desktop: side-by-side only when truly wide enough ── */
    @media (min-width: 960px) {
      .chat-page { grid-template-columns: 240px 1fr; }

      .thread-drawer {
        position: static !important;
        transform: none !important;
        inset: auto;
        width: auto; z-index: auto;
        border-right: 1px solid var(--border);
        border-radius: 0;
        box-shadow: none;
        overflow-y: auto;
      }

      .drawer-backdrop, .topbar-menu, .drawer-close { display: none !important; }
      .chat-controls select {
        width: clamp(180px, 34vw, 420px);
        max-width: 420px;
      }
      .bubble { max-width: 72%; }
      .chat-feed { padding: .6rem .9rem; }
    }

    @media (max-width: 560px) {
      .topbar-title {
        flex: 0 0 auto;
      }

      .chat-controls select {
        width: clamp(140px, 48vw, 260px);
      }
    }

    @media (min-width: 1200px) {
      .chat-page { grid-template-columns: 280px 1fr; }
    }
  </style>
</head>
<body data-page="ai">
  <div id="siderail-mount"></div>

  <!-- Hidden checkbox drives drawer open/close via CSS sibling selectors -->
  <input type="checkbox" id="drawer-toggle" />
  <label for="drawer-toggle" class="drawer-backdrop"></label>

  <main class="chat-page">
    <aside class="thread-drawer">
      <div class="drawer-head">
        <span class="drawer-title">Threads</span>
        <label for="drawer-toggle" class="drawer-close" aria-label="Close">&times;</label>
      </div>
      <div class="drawer-actions">
        <button id="chat-new-thread" class="btn-new-thread" type="button">+ New Thread</button>
        <button id="chat-back" class="btn-mini" type="button">← Back</button>
      </div>
      <div id="chat-thread-list" class="thread-list"></div>
      <div class="drawer-footer">
        <button id="chat-new-thread-sidebar" class="btn-new-thread btn-new-thread--main" type="button">Create New Thread</button>
        <span class="status-note" id="chat-sync-state">Sync state unknown.</span>
      </div>
    </aside>

    <section class="chat-main">
      <div class="chat-topbar">
        <label for="drawer-toggle" class="topbar-menu" aria-label="Threads">&#9776;</label>
        <span class="topbar-title">AI Chat</span>
        <div class="chat-controls">
          <div id="chat-model-picker-mount" style="flex: 1; max-width: 280px; min-width: 140px;"></div>
          <button id="chat-clear-thread" class="btn-mini" type="button">Clear</button>
          <button id="chat-delete-thread" class="btn-mini btn-danger" type="button">Del</button>
        </div>
      </div>
      <div id="chat-model-detail-mount" style="padding: 0 0.5rem;"></div>
      <div id="chat-feed" class="chat-feed"></div>
      <form id="chat-composer" class="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="chat-input" class="chat-input" rows="1" placeholder="Ask about a stock, ratio, or market trend..." autocomplete="off"></textarea>
          <div class="composer-toolbar">
            <div class="composer-toolbar__left">
              <label class="composer-chip" for="chat-include-stock-data" title="Include stock analysis context">
                <input id="chat-include-stock-data" type="checkbox" />
                <svg class="composer-chip__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>
                <span>Stock Data</span>
              </label>
            </div>
            <div class="composer-toolbar__right">
              <button id="chat-send" class="btn-send" type="submit" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              </button>
            </div>
          </div>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="./src/chatApp.js"></script>
  <script type="module" src="./src/navStatus.js"></script>
  <script type="module" src="./src/swRegister.js"></script>
  <script type="module" src="./src/mobile-nav.js"></script>
  <div id="more-mount"></div>
  <div id="tabbar-mount"></div>
  <div id="footer-mount"></div>
  <script type="module" src="./src/shell.js"></script>
</body>
</html>
