<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DSE Toolkit - AI Chat</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* ── Full-height flex layout ── */
    html { height: 100%; }
    body  { height: 100%; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
    .nav-bar { flex-shrink: 0; position: relative; }  /* override sticky from styles.css */

    /* ── Page wrapper fills remaining height ── */
    .chat-page {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      overflow: hidden;
      background: var(--bg);
    }
    .chat-page > * { min-width: 0; min-height: 0; overflow: hidden; }

    /* ── Drawer checkbox (hidden) ── */
    #drawer-toggle { display: none; }

    /* ── Backdrop overlay ── */
    .drawer-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    #drawer-toggle:checked ~ .drawer-backdrop {
      opacity: 1; pointer-events: auto;
    }

    /* ── Thread drawer (mobile = off-screen, desktop = inline) ── */
    .thread-drawer {
      position: fixed;
      inset-block: 0; left: 0;
      width: min(280px, calc(100vw - 42px));
      z-index: 100;
      background: var(--card);
      border-right: 1px solid var(--border);
      border-radius: 0 12px 12px 0;
      box-shadow: 0 10px 28px rgba(2, 6, 23, 0.28);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform .22s ease;
    }
    #drawer-toggle:checked ~ .chat-page .thread-drawer {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex; align-items: center;
      gap: .5rem;
      padding: .55rem .65rem;
      border-bottom: 1px solid var(--border);
    }
    .drawer-head .drawer-title {
      flex: 1; font-weight: 700; font-size: .9rem; color: var(--text);
    }
    .drawer-close {
      background: none; border: none;
      font-size: 1.3rem; line-height: 1;
      color: var(--muted); cursor: pointer;
      padding: .15rem .35rem;
    }

    .drawer-actions {
      display: flex; gap: .35rem;
      padding: .45rem .65rem;
      border-bottom: 1px solid var(--border);
    }
    .btn-new-thread {
      flex: 1;
      border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      border-radius: 8px;
      padding: .38rem .55rem;
      font-weight: 600; font-size: .8rem;
      cursor: pointer; font-family: inherit;
    }

    .btn-new-thread--main {
      width: 100%;
      margin-top: .35rem;
      padding: .44rem .6rem;
      font-size: .82rem;
      border-radius: 10px;
    }

    .thread-list {
      flex: 1; overflow-y: auto;
      padding: .35rem;
      margin-top: 1rem;
      display: grid; gap: .25rem; align-content: start;
      -webkit-overflow-scrolling: touch;
    }
    .thread-item {
      width: 97%;
      border: 1px solid var(--border);
      background: var(--card); color: var(--text);
      border-radius: 8px;
      padding: .45rem .55rem;
      cursor: pointer; text-align: left;
      font-family: inherit; font-size: .82rem;
    }
    .thread-item:active { opacity: .7; }
    .thread-item.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--card));
    }
    .thread-item__title {
      font-weight: 600; display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thread-item__meta {
      font-size: .68rem; color: var(--muted); margin-top: .05rem;
    }

    .drawer-footer {
      padding: .4rem .65rem;
      border-top: 1px solid var(--border);
    }

    /* ── Chat main area ── */
    .chat-main {
      display: flex; flex-direction: column;
      overflow: hidden; min-height: 0; min-width: 0;
    }

    /* ── Top bar ── */
    .chat-topbar {
      display: flex; align-items: center;
      gap: .35rem;
      padding: .4rem .55rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-menu {
      background: none; border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer;
      padding: .25rem .4rem;
      font-size: 1.05rem; line-height: 1;
      color: var(--text); flex-shrink: 0;
    }
    .topbar-title {
      font-weight: 700; font-size: .85rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .chat-controls {
      display: flex; align-items: center; gap: .25rem;
      flex: 1; min-width: 0;
      justify-content: flex-end;
    }
    .chat-controls select {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .25rem .35rem;
      font-size: .75rem; font-family: inherit;
      flex: 1;
      min-width: 0;
      width: clamp(128px, 42vw, 280px);
      max-width: 280px;
    }
    .btn-mini {
      border: 1px solid var(--border);
      background: var(--card); color: var(--muted);
      border-radius: 6px;
      padding: .25rem .45rem;
      font-size: .72rem; font-family: inherit;
      cursor: pointer; white-space: nowrap;
    }
    .btn-danger {
      border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      color: var(--danger);
    }

    /* ── Feed ── */
    .chat-feed {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: .5rem;
      display: flex; flex-direction: column;
      gap: .45rem;
      -webkit-overflow-scrolling: touch;
    }
    .bubble {
      max-width: 88%;
      padding: .55rem .7rem;
      border-radius: 14px;
      line-height: 1.5;
      font-size: .86rem;
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .bubble-user {
      align-self: flex-end;
      background: var(--accent); color: #fff;
      border-radius: 14px 14px 4px 14px;
    }
    .bubble-assistant {
      align-self: flex-start;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px 14px 14px 4px;
    }
    .bubble-system {
      align-self: center;
      background: transparent; color: var(--muted);
      text-align: center; font-size: .78rem;
      padding: .25rem .5rem;
    }
    .bubble-meta {
      margin-top: .25rem; font-size: .66rem; color: var(--muted);
      display: flex; gap: .25rem; flex-wrap: wrap;
    }

    .bubble-meta-toggle,
    .bubble-retry {
      margin-top: .3rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: .12rem .45rem;
      font-size: .65rem;
      cursor: pointer;
      font-family: inherit;
    }

    .bubble-retry {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.5);
    }

    .bubble-thinking {
      background: color-mix(in srgb, var(--card) 95%, transparent);
      border: 1px dashed color-mix(in srgb, var(--border) 85%, transparent);
    }

    .thinking-dots {
      display: inline-flex;
      gap: .25rem;
      margin-right: .45rem;
      vertical-align: middle;
    }

    .thinking-dots span {
      width: .34rem;
      height: .34rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 75%, #fff 25%);
      opacity: .35;
      animation: thinking-pulse 1s ease-in-out infinite;
    }

    .thinking-dots span:nth-child(2) { animation-delay: .16s; }
    .thinking-dots span:nth-child(3) { animation-delay: .32s; }

    @keyframes thinking-pulse {
      0%, 100% { opacity: .25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1px); }
    }

    /* ── Composer ── */
    .composer {
      display: flex; align-items: flex-end;
      flex-wrap: wrap;
      gap: .35rem;
      padding: .4rem .55rem;
      padding-bottom: calc(.4rem + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }

    .composer-options {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .composer-check {
      display: inline-flex;
      align-items: center;
      gap: .32rem;
      font-size: .68rem;
      color: var(--muted);
      user-select: none;
      cursor: pointer;
    }

    .composer-check input {
      width: .85rem;
      height: .85rem;
      accent-color: var(--accent);
    }
    .chat-input {
      flex: 1; min-width: 0;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: .45rem .7rem;
      font-size: .86rem; font-family: inherit;
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .chat-input:focus { border-color: var(--accent); }

    .btn-send {
      flex-shrink: 0; width: 36px; height: 36px;
      border-radius: 50%; border: none;
      background: var(--accent); color: #fff;
      cursor: pointer;
      display: grid; place-items: center;
      font-size: 0;
    }
    .btn-send::after {
      content: '';
      width: 0; height: 0;
      border-left: 7px solid #fff;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      margin-left: 2px;
      margin-bottom: 5px;
    }
    .btn-send:disabled { opacity: .35; cursor: default; }

    .status-note { font-size: .7rem; color: var(--muted); }

    /* ── Desktop: side-by-side only when truly wide enough ── */
    @media (min-width: 960px) {
      .chat-page { grid-template-columns: 240px 1fr; }

      .thread-drawer {
        position: static !important;
        transform: none !important;
        inset: auto;
        width: auto; z-index: auto;
        border-right: 1px solid var(--border);
        border-radius: 0;
        box-shadow: none;
        overflow-y: auto;
      }

      .drawer-backdrop, .topbar-menu, .drawer-close { display: none !important; }
      .chat-controls select {
        width: clamp(180px, 34vw, 420px);
        max-width: 420px;
      }
      .bubble { max-width: 72%; }
      .chat-feed { padding: .6rem .9rem; }
    }

    @media (max-width: 560px) {
      .topbar-title {
        flex: 0 0 auto;
      }

      .chat-controls select {
        width: clamp(140px, 48vw, 260px);
      }
    }

    @media (min-width: 1200px) {
      .chat-page { grid-template-columns: 280px 1fr; }
    }
  </style>
</head>
<body>
  <div id="siderail-mount"></div>

  <!-- Hidden checkbox drives drawer open/close via CSS sibling selectors -->
  <input type="checkbox" id="drawer-toggle" />
  <label for="drawer-toggle" class="drawer-backdrop"></label>

  <main class="chat-page">
    <aside class="thread-drawer">
      <div class="drawer-head">
        <span class="drawer-title">Threads</span>
        <label for="drawer-toggle" class="drawer-close" aria-label="Close">&times;</label>
      </div>
      <div class="drawer-actions">
        <button id="chat-new-thread" class="btn-new-thread" type="button">+ New Thread</button>
        <button id="chat-back" class="btn-mini" type="button">← Back</button>
      </div>
      <div id="chat-thread-list" class="thread-list"></div>
      <div class="drawer-footer">
        <button id="chat-new-thread-sidebar" class="btn-new-thread btn-new-thread--main" type="button">Create New Thread</button>
        <span class="status-note" id="chat-sync-state">Sync state unknown.</span>
      </div>
    </aside>

    <section class="chat-main">
      <div class="chat-topbar">
        <label for="drawer-toggle" class="topbar-menu" aria-label="Threads">&#9776;</label>
        <span class="topbar-title">AI Chat</span>
        <div class="chat-controls">
          <div id="chat-model-picker-mount" style="flex: 1; max-width: 280px; min-width: 140px;"></div>
          <button id="chat-clear-thread" class="btn-mini" type="button">Clear</button>
          <button id="chat-delete-thread" class="btn-mini btn-danger" type="button">Del</button>
        </div>
      </div>
      <div id="chat-model-detail-mount" style="padding: 0 0.5rem;"></div>
      <div id="chat-feed" class="chat-feed"></div>
      <form id="chat-composer" class="composer" autocomplete="off">
        <div class="composer-options">
          <label class="composer-check" for="chat-include-stock-data">
            <input id="chat-include-stock-data" type="checkbox" />
            Include stock data
          </label>
        </div>
        <textarea id="chat-input" class="chat-input" rows="1" placeholder="Ask about a stock or the market..." autocomplete="off"></textarea>
        <button id="chat-send" class="btn-send" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script type="module" src="./src/chatApp.js"></script>
  <script type="module" src="./src/navStatus.js"></script>
  <script type="module" src="./src/swRegister.js"></script>
  <script type="module" src="./src/mobile-nav.js"></script>
  <div id="more-mount"></div>
  <div id="tabbar-mount"></div>
  <div id="footer-mount"></div>
  <script type="module" src="./src/shell.js"></script>
</body>
</html>
